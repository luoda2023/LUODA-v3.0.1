permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
  packages: read

name: Build LDesk Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [3.1.1]
    paths:
      - 'build.rs'
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-msi.yml'
      - 'res/**'
      - 'vcpkg.json'
      - 'vdi/**'

jobs:
  build-msi:
    runs-on: windows-2022
    timeout-minutes: 180
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-msi-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-msi-${{ runner.os }}-

      - name: Setup Flutter
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Ensure correct cargo version
        run: |
          rustup default 1.88
          cargo --version

      - name: Configure Git for private forks
        shell: bash
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Generate FFI bridge
        timeout-minutes: 20
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "=== Installing cargo-expand ==="
          cargo install cargo-expand --version 1.0.95 --locked 2>&1 | tail -5
          echo "=== Installing flutter_rust_bridge_codegen ==="
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked 2>&1 | tail -5
          echo "=== Running flutter pub get ==="
          cd flutter && flutter pub get && cd ..
          GENERATED="flutter/lib/generated_bridge.dart"
          if [ -f "$GENERATED" ] && [ "$(git log -1 --format="%an" -- "$GENERATED" 2>/dev/null)" != "" ]; then
            echo "=== Bridge file already exists, skipping codegen ==="
            ls -la "$GENERATED"
            head -5 "$GENERATED"
          else
          echo "=== Running flutter_rust_bridge_codegen ==="
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart 2>&1 || echo "WARNING: codegen failed, using existing file"
          fi
          echo "=== Verifying generated file ==="
          ls -la flutter/lib/generated_bridge.dart || echo "ERROR: generated_bridge.dart not created!"
          head -5 flutter/lib/generated_bridge.dart || echo "ERROR: Cannot read file!"

      - name: Setup vcpkg
        shell: bash
        run: |
          # run-vcpkg@v11 with vcpkgDirectory:C:\vcpkg fails with
          # "outside repository at D:/a/..." on windows runners; clone and
          # bootstrap vcpkg natively instead (same pinned commit as before).
          if [ ! -d "C:/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          fi
          # Shallow clones cannot reach the pinned commit; use full clone so
          # the overlay ports in ./res/vcpkg match the pinned vcpkg version.
          git -C C:/vcpkg checkout "120deac3062162151622ca4860575a33844ba10b"
          C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          echo "vcpkg ready: $(C:/vcpkg/vcpkg.exe version | head -1)"
          echo "VCPKG_ROOT=C:/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-msi-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-msi-${{ runner.os }}-

      - name: Install vcpkg deps
        timeout-minutes: 40
        run: |
          # Enable vcpkg binary caching to avoid recompiling AOM/FFmpeg from source
          $env:VCPKG_BINARY_SOURCES="clear;files,$env:VCPKG_ROOT\archives,readwrite"
          # Add timeout: kill if vcpkg hangs (40 min step timeout + 35 min internal timeout)
          $proc = Start-Process -NoNewWindow -PassThru -FilePath "vcpkg" -ArgumentList "install --triplet x64-windows-static --x-install-root=$env:VCPKG_ROOT\installed --clean-after-build"
          $timeout = 2100  # 35 minutes in seconds
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while (-not $proc.HasExited) {
            if ($sw.Elapsed.TotalSeconds -gt $timeout) {
              Write-Host "FATAL: vcpkg install timed out after 35 min, killing..."
              $proc.Kill()
              exit 1
            }
            Start-Sleep -Seconds 10
          }
          if ($proc.ExitCode -ne 0) {
            Write-Host "vcpkg install failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          Write-Host "vcpkg install complete"

      - name: Build Rust
        timeout-minutes: 50
        shell: bash
        run: |
          cargo build --release --features flutter
        env:
          VCPKG_ROOT: C:\\\\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          VCPKG_INSTALLED_ROOT: C:\\\\vcpkg\\\\installed\\\\x64-windows-static
          SODIUM_LIB_DIR: C:\\\\vcpkg\\\\installed\\\\x64-windows-static\\\\lib
          CXXFLAGS: -include cstdint

      - name: Validate shared chat and UI contracts
        timeout-minutes: 25
        run: |
          cd flutter
          flutter pub get
          flutter test test/direct_chat_protocol_test.dart test/viewer_invite_link_test.dart test/ui_regression_contract_test.dart

      - name: Normalize Windows resource encoding
        shell: pwsh
        run: |
          $path = 'flutter/windows/runner/Runner.rc'
          $content = [IO.File]::ReadAllText($path, [Text.Encoding]::Unicode)
          [IO.File]::WriteAllText(
            $path,
            $content,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build Flutter Windows
        timeout-minutes: 15
        run: |
          cd flutter
          flutter clean
          flutter build windows --release

      - name: Include remote printer adapter
        shell: pwsh
        run: |
          $releaseDir = 'flutter\build\windows\x64\runner\Release'
          Expand-Archive `
            -LiteralPath 'res\drivers\printer_driver_adapter.zip' `
            -DestinationPath $releaseDir `
            -Force
          $adapter = Join-Path $releaseDir 'printer_driver_adapter.dll'
          if (-not (Test-Path -LiteralPath $adapter -PathType Leaf)) {
            throw "Remote printer adapter is missing: $adapter"
          }
          $driversDir = Join-Path $releaseDir 'drivers'
          Expand-Archive `
            -LiteralPath 'res\drivers\luoda_printer_driver_v4-1.4.zip' `
            -DestinationPath $driversDir `
            -Force
          $driverInf = Join-Path `
            $driversDir `
            'rustdesk_printer_driver_v4-1.4\RustDeskPrinterDriver.inf'
          if (-not (Test-Path -LiteralPath $driverInf -PathType Leaf)) {
            throw "Remote printer driver is missing: $driverInf"
          }

      - name: Include signed virtual display driver
        shell: pwsh
        run: |
          $releaseDir = 'flutter\build\windows\x64\runner\Release'
          $driverUrl = 'https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip'
          $expectedSha256 = '629B51E9944762BAE73948171C65D09A79595CF4C771A82EBC003FBBA5B24F51'
          $driverArchive = Join-Path $env:RUNNER_TEMP 'usbmmidd_v2.zip'
          curl.exe --fail --location --retry 3 --output $driverArchive $driverUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the signed virtual display driver"
          }
          $actualSha256 = (Get-FileHash -LiteralPath $driverArchive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Virtual display driver checksum mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $driverArchive -DestinationPath $releaseDir -Force
          $requiredDriverFiles = @(
            'usbmmidd_v2\usbmmIdd.inf',
            'usbmmidd_v2\usbmmidd.cat',
            'usbmmidd_v2\x64\usbmmIdd.dll',
            'usbmmidd_v2\deviceinstaller64.exe'
          )
          foreach ($relativePath in $requiredDriverFiles) {
            $driverFile = Join-Path $releaseDir $relativePath
            if (-not (Test-Path -LiteralPath $driverFile -PathType Leaf)) {
              throw "Virtual display driver file is missing: $driverFile"
            }
          }

      - name: Verify Flutter font assets
        shell: powershell
        run: |
          $assetRoot = "flutter\build\windows\x64\runner\Release\data\flutter_assets"
          $requiredFonts = @(
            "fonts\MaterialIcons-Regular.otf",
            "assets\gestures.ttf",
            "assets\tabbar.ttf",
            "assets\peer_searchbar.ttf",
            "assets\address_book.ttf",
            "assets\device_group.ttf",
            "assets\more.ttf",
            "assets\NotoSansCJKsc-Regular.otf",
            "assets\NotoSansSymbols2-Regular.ttf",
            "assets\NotoColorEmoji.ttf"
          )
          foreach ($font in $requiredFonts) {
            $fontPath = Join-Path $assetRoot $font
            if (-not (Test-Path -LiteralPath $fontPath -PathType Leaf)) {
              throw "Required Flutter font asset is missing: $fontPath"
            }
          }

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Copy Flutter output for MSI
        shell: cmd
        run: |
          if not exist ldesk mkdir ldesk
          xcopy /E /I flutter\build\windows\x64\runner\Release\* ldesk\
          move ldesk\luoda.exe ldesk\LDesk.exe

      - name: Preprocess MSI
        shell: cmd
        run: |
          cd res\msi
          python preprocess.py --dist-dir ../../ldesk --app-name LDesk -m LDesk -v 3.1.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages for CustomActions
        shell: cmd
        run: |
          cd res\msi\CustomActions
          nuget restore packages.config -PackagesDirectory ..\packages
          if %ERRORLEVEL% NEQ 0 (
            echo "NuGet restore failed, trying alternative..."
            nuget restore packages.config -PackagesDirectory ..\packages -Source https://api.nuget.org/v3/index.json
          )
          cd ..\..

      - name: Build MSI with MSBuild
        shell: powershell
        run: |
          # FIXED: $msbuild = "path" not $msbuild = & "path" (the & operator executes, not assigns!)
          $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            Write-Host "MSBuild not at default path, searching..."
            $msbuild = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "MSBuild.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $msbuild) {
            Write-Error "MSBuild.exe not found!"
            exit 1
          }
          Write-Host "Using MSBuild: $msbuild"
          cd res\msi
          & $msbuild msi.sln /p:Configuration=Release /p:Platform=x64 /restore

      - name: Collect MSI outputs
        shell: powershell
        run: |
          $dist = "res\msi\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $msis = Get-ChildItem -Path "res\msi\Package\bin\x64\Release" -Recurse -Filter "*.msi"
          if (-not $msis) {
            Write-Error "No MSI files found"
            exit 1
          }
          foreach ($msi in $msis) {
            $culture = Split-Path $msi.DirectoryName -Leaf
            $output = Join-Path $dist "LDesk-3.1.1-Setup-$culture.msi"
            Copy-Item $msi.FullName -Destination $output -Force
          }
          Get-ChildItem $dist -Filter "*.msi" | Format-Table Name,Length

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-3.1.1-MSI
          path: res/msi/dist/*.msi
          if-no-files-found: error

      - name: Upload to Release
        if: github.ref == 'refs/heads/3.1.1'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          prerelease: false
          draft: true
          tag_name: v3.1.1
          token: ${{ secrets.RELEASE_PAT }}
          files: res/msi/dist/LDesk-3.1.1-Setup-*.msi
      - name: Upload runtime logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-msi
          path: .auto_build_logs/




name: Build LDesk Client EXE
on:
  workflow_dispatch:
  push:
    branches: [3.1.1]
    paths:
      - 'build.rs'
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'Images/**'
      - 'res/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vcpkg.json'
      - '.github/workflows/build-client-exe.yml'
permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
  packages: read
jobs:
  build-client-exe:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify branded icon assets
        shell: powershell
        run: |
          $checks = @(
            @{ Source = 'Images\icon.ico'; Target = 'res\icon.ico' },
            @{ Source = 'Images\icon.ico'; Target = 'flutter\assets\icon.ico' },
            @{ Source = 'Images\icon.ico'; Target = 'flutter\windows\runner\resources\app_icon.ico' },
            @{ Source = 'Images\icon-512.png'; Target = 'flutter\assets\icon.png' },
            @{ Source = 'Images\icon-512.png'; Target = 'flutter\assets\avatar.png' },
            @{ Source = 'Images\icon-32.ico'; Target = 'res\tray-icon.ico' }
          )
          foreach ($check in $checks) {
            $sourceHash = (Get-FileHash -LiteralPath $check.Source -Algorithm SHA256).Hash
            $targetHash = (Get-FileHash -LiteralPath $check.Target -Algorithm SHA256).Hash
            if ($sourceHash -ne $targetHash) {
              throw "Brand icon mismatch: $($check.Target)"
            }
          }
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-client-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-client-${{ matrix.arch }}-${{ runner.os }}-
      - name: Setup Flutter
        if: matrix.arch == 'x64'
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.88'
          targets: ${{ matrix.arch == 'x86' && 'i686-pc-windows-msvc' || '' }}
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Ensure correct cargo version
        run: |
          rustup default 1.88
          cargo --version
      - name: Configure Git for private forks
        shell: bash
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Generate FFI bridge
        if: matrix.arch == 'x64'
        timeout-minutes: 20
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "=== Installing cargo-expand ==="
          cargo install cargo-expand --version 1.0.95 --locked 2>&1 | tail -5
          echo "=== Installing flutter_rust_bridge_codegen ==="
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked 2>&1 | tail -5
          echo "=== Running flutter pub get ==="
          cd flutter && flutter pub get && cd ..
          echo "=== Running flutter_rust_bridge_codegen ==="
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart 2>&1
          echo "=== Verifying generated file ==="
          ls -la flutter/lib/generated_bridge.dart || echo "ERROR: generated_bridge.dart not created!"
          head -5 flutter/lib/generated_bridge.dart || echo "ERROR: Cannot read file!"
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: "120deac3062162151622ca4860575a33844ba10b"
          vcpkgTriplet: ${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-client-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-client-${{ matrix.arch }}-${{ runner.os }}-
      - name: Install vcpkg deps
        timeout-minutes: 40
        shell: bash
        run: |
          triplet="${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}"
          vcpkg install --triplet "$triplet" --x-install-root="$VCPKG_ROOT/installed"
      - name: Build Rust (Client Only mode)
        timeout-minutes: 50
        shell: bash
        run: |
          LUODA_CLIENT_ONLY=1 cargo build --release --features "flutter,client_only"
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}
          CXXFLAGS: -include cstdint
          SODIUM_LIB_DIR: C:\vcpkg\installed\${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}\lib
      - name: Validate direct IP client safeguards
        if: matrix.arch == 'x64'
        timeout-minutes: 10
        shell: bash
        run: |
          LUODA_CLIENT_ONLY=1 cargo test --release --features "flutter,client_only" --lib direct_endpoint_tests -- --nocapture
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          CXXFLAGS: -include cstdint
          SODIUM_LIB_DIR: C:\vcpkg\installed\x64-windows-static\lib
      - name: Validate client UI contract
        if: matrix.arch == 'x64'
        timeout-minutes: 5
        run: |
          cd flutter
          flutter test test/ui_regression_contract_test.dart
      - name: Build Flutter Windows
        if: matrix.arch == 'x64'
        timeout-minutes: 15
        run: |
          cd flutter
          flutter clean
          flutter build windows --release --dart-define=CLIENT_ONLY=true
      - name: Verify Flutter font assets
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $assetRoot = "flutter\build\windows\x64\runner\Release\data\flutter_assets"
          $requiredFonts = @(
            "fonts\MaterialIcons-Regular.otf",
            "assets\gestures.ttf",
            "assets\tabbar.ttf",
            "assets\peer_searchbar.ttf",
            "assets\address_book.ttf",
            "assets\device_group.ttf",
            "assets\more.ttf"
          )
          foreach ($font in $requiredFonts) {
            $fontPath = Join-Path $assetRoot $font
            if (-not (Test-Path -LiteralPath $fontPath -PathType Leaf)) {
              throw "Required Flutter font asset is missing: $fontPath"
            }
          }
      - name: Sign executable with LDesk icon
        shell: bash
        run: |
          choco install rcedit -y
          rcedit "flutter/build/windows/x64/runner/Release/luoda.exe" --set-icon "Images/icon.ico"
      - name: Build portable packer
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p Release
          cp -r flutter/build/windows/x64/runner/Release/* Release/
          if [ ! -f "Release/sciter.dll" ]; then
            echo "=== Downloading sciter.dll ==="
            SCITER_URL="https://github.com/c-smile/sciter-sdk/raw/master/bin/windows/x64/sciter.dll"
            for i in 1 2 3; do
              if curl -sL -o Release/sciter.dll "$SCITER_URL"; then
                echo "sciter.dll downloaded successfully"
                break
              fi
              echo "Attempt $i failed, retrying..."
              sleep 3
            done
          fi
          ls -la Release/sciter.dll 2>/dev/null || echo "WARN: sciter.dll not found!"
          echo "=== Release directory ==="
          ls -la Release/
          pip3 install brotli
          cd libs/portable
          python3 generate.py -f ../../Release/ -o . -e ../../Release/luoda.exe
          cd ../..
          cd libs/portable
          cargo build --release
          cd ../..
          mkdir -p SignOutput
          cp target/release/luoda-portable-packer.exe SignOutput/LDesk-Client-x64.exe
          echo "=== Final Client EXE ==="
          ls -la SignOutput/LDesk-Client-x64.exe
      - name: Smoke test LDesk client identity panel
        if: matrix.arch == 'x64'
        timeout-minutes: 2
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class LDeskWindow {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
          }
          '@
          $startedAt = Get-Date
          $launcher = Start-Process `
            -FilePath (Resolve-Path 'SignOutput\LDesk-Client-x64.exe') `
            -WorkingDirectory (Resolve-Path 'SignOutput') `
            -PassThru
          $windowProcess = $null
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $windowProcess = Get-Process | Where-Object {
                $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like '*LDesk*'
              } | Where-Object {
                try { $_.StartTime -ge $startedAt.AddSeconds(-2) } catch { $false }
              } | Select-Object -First 1
            } while ($null -eq $windowProcess -and [DateTime]::UtcNow -lt $deadline)
            if ($null -eq $windowProcess) {
              throw 'LDesk client did not create its identity window within 30 seconds'
            }
            $windowProcess.Refresh()
            if (-not $windowProcess.Responding) {
              throw 'LDesk client identity window is not responding'
            }
            $rect = New-Object LDeskWindow+RECT
            if (-not [LDeskWindow]::GetWindowRect($windowProcess.MainWindowHandle, [ref]$rect)) {
              throw 'Failed to inspect the LDesk client window bounds'
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ([Math]::Abs($width - 380) -gt 32 -or [Math]::Abs($height - 500) -gt 32) {
              throw "Unexpected LDesk client window size: ${width}x${height}"
            }
          } finally {
            if ($null -ne $windowProcess -and -not $windowProcess.HasExited) {
              Stop-Process -Id $windowProcess.Id -Force -ErrorAction SilentlyContinue
            }
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Verify Windows version metadata
        shell: powershell
        run: |
          $version = (Get-Item "SignOutput\LDesk-Client-x64.exe").VersionInfo
          if ($version.FileVersion -ne "3.1.1" -or $version.ProductVersion -ne "3.1.1") {
            throw "Unexpected client EXE version: FileVersion=$($version.FileVersion), ProductVersion=$($version.ProductVersion)"
          }
          if ($version.ProductName -ne "LDesk" -or
              $version.FileDescription -ne "LDesk Direct Chat and Remote Assistance") {
            throw "Unexpected client EXE branding: ProductName=$($version.ProductName), FileDescription=$($version.FileDescription)"
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-3.1.1-Client-${{ matrix.arch }}
          path: SignOutput/LDesk-Client-x64.exe
          if-no-files-found: error
      - name: Upload runtime logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-${{ matrix.arch }}
          path: .auto_build_logs/
      - name: Rename Client EXE for release
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          Copy-Item 'SignOutput/LDesk-Client-x64.exe' 'SignOutput/LDesk-3.1.1-Client-x64.exe'
      - name: Upload to v3.1.1 Release (client)
        if: matrix.arch == 'x64' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/3.1.1'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          draft: true
          tag_name: v3.1.1
          files: SignOutput/LDesk-3.1.1-Client-x64.exe

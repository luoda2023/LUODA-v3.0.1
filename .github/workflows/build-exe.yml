name: Build LDesk Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [3.1.1]
    paths:
      - 'build.rs'
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'Images/**'
      - 'res/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vcpkg.json'
      - '.github/workflows/build-exe.yml'
permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
  packages: read
jobs:
  build-exe:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify branded icon assets
        shell: powershell
        run: |
          $checks = @(
            @{ Source = 'Images\icon.ico'; Target = 'res\icon.ico' },
            @{ Source = 'Images\icon.ico'; Target = 'flutter\assets\icon.ico' },
            @{ Source = 'Images\icon.ico'; Target = 'flutter\windows\runner\resources\app_icon.ico' },
            @{ Source = 'Images\icon-32.png'; Target = 'res\tray-icon.png' },
            @{ Source = 'Images\icon-512.png'; Target = 'res\icon.png' },
            @{ Source = 'Images\icon-512.png'; Target = 'flutter\assets\icon.png' },
            @{ Source = 'Images\icon-512.png'; Target = 'flutter\assets\avatar.png' },
            @{ Source = 'Images\icon-32.png'; Target = 'res\32x32.png' },
            @{ Source = 'Images\icon-64.png'; Target = 'res\64x64.png' },
            @{ Source = 'Images\icon-128.png'; Target = 'res\128x128.png' },
            @{ Source = 'Images\icon-256.png'; Target = 'res\128x128@2x.png' },
            @{ Source = 'Images\icon-master-1056.png'; Target = 'res\mac-icon.png' },
            @{ Source = 'Images\icon-256.png'; Target = 'res\tray-icon-source.png' }
          )
          foreach ($check in $checks) {
            $sourceHash = (Get-FileHash -LiteralPath $check.Source -Algorithm SHA256).Hash
            $targetHash = (Get-FileHash -LiteralPath $check.Target -Algorithm SHA256).Hash
            if ($sourceHash -ne $targetHash) {
              throw "Brand icon mismatch: $($check.Target)"
            }
          }
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-exe-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-exe-${{ matrix.arch }}-${{ runner.os }}-
      - name: Setup Flutter
        if: matrix.arch == 'x64'
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.88'
          targets: ${{ matrix.arch == 'x86' && 'i686-pc-windows-msvc' || '' }}
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Ensure correct cargo version
        run: |
          rustup default 1.88
          cargo --version
      - name: Configure Git for private forks
        shell: bash
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Generate FFI bridge
        if: matrix.arch == 'x64'
        timeout-minutes: 20
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "=== Installing cargo-expand ==="
          cargo install cargo-expand --version 1.0.95 --locked 2>&1 | tail -5
          echo "=== Installing flutter_rust_bridge_codegen ==="
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked 2>&1 | tail -5
          echo "=== Running flutter pub get ==="
          cd flutter && flutter pub get && cd ..
          echo "=== Running flutter_rust_bridge_codegen ==="
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart 2>&1
          echo "=== Verifying generated file ==="
          ls -la flutter/lib/generated_bridge.dart || echo "ERROR: generated_bridge.dart not created!"
          head -5 flutter/lib/generated_bridge.dart || echo "ERROR: Cannot read file!"
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: "120deac3062162151622ca4860575a33844ba10b"
          vcpkgTriplet: ${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-exe-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-exe-${{ matrix.arch }}-${{ runner.os }}-
      - name: Install vcpkg deps
        timeout-minutes: 40
        shell: bash
        run: |
          triplet="${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}"
          vcpkg install --triplet "$triplet" --x-install-root="$VCPKG_ROOT/installed"
      - name: Build Rust
        timeout-minutes: 50
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            cargo build --release --target i686-pc-windows-msvc
          else
            cargo build --release --features flutter
          fi
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}
          CXXFLAGS: -include cstdint
          SODIUM_LIB_DIR: C:\vcpkg\installed\${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}\lib
      - name: Validate direct IP access
        if: matrix.arch == 'x64'
        timeout-minutes: 30
        shell: bash
        run: |
          cargo test --release --features flutter --lib direct_access::tests -- --nocapture
          cargo test --release --features flutter --lib direct_endpoint_tests -- --nocapture
          cargo test --release --features flutter --lib direct_port_tests -- --nocapture
          cargo test --release --features flutter --lib debug_api::tests -- --nocapture
          cargo test --release --features flutter --test viewer_invite_policy -- --nocapture
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          CXXFLAGS: -include cstdint
          SODIUM_LIB_DIR: C:\vcpkg\installed\x64-windows-static\lib
      - name: Validate shared chat and UI contracts
        if: matrix.arch == 'x64'
        timeout-minutes: 5
        run: |
          cd flutter
          flutter pub get
          flutter test test/direct_chat_protocol_test.dart test/viewer_invite_link_test.dart test/ui_regression_contract_test.dart test/remote_window_chrome_contract_test.dart
      - name: Normalize Windows resource encoding
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $path = 'flutter/windows/runner/Runner.rc'
          $content = [IO.File]::ReadAllText($path, [Text.Encoding]::Unicode)
          [IO.File]::WriteAllText(
            $path,
            $content,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Build Flutter Windows
        if: matrix.arch == 'x64'
        timeout-minutes: 15
        run: |
          cd flutter
          flutter clean
          flutter build windows --release
      - name: Include remote printer adapter
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $releaseDir = 'flutter\build\windows\x64\runner\Release'
          Expand-Archive `
            -LiteralPath 'res\drivers\printer_driver_adapter.zip' `
            -DestinationPath $releaseDir `
            -Force
          $adapter = Join-Path $releaseDir 'printer_driver_adapter.dll'
          if (-not (Test-Path -LiteralPath $adapter -PathType Leaf)) {
            throw "Remote printer adapter is missing: $adapter"
          }
          $driversDir = Join-Path $releaseDir 'drivers'
          Expand-Archive `
            -LiteralPath 'res\drivers\luoda_printer_driver_v4-1.4.zip' `
            -DestinationPath $driversDir `
            -Force
          $driverInf = Join-Path `
            $driversDir `
            'rustdesk_printer_driver_v4-1.4\RustDeskPrinterDriver.inf'
          if (-not (Test-Path -LiteralPath $driverInf -PathType Leaf)) {
            throw "Remote printer driver is missing: $driverInf"
          }
      - name: Include signed virtual display driver
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $releaseDir = 'flutter\build\windows\x64\runner\Release'
          $driverUrl = 'https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip'
          $expectedSha256 = '629B51E9944762BAE73948171C65D09A79595CF4C771A82EBC003FBBA5B24F51'
          $driverArchive = Join-Path $env:RUNNER_TEMP 'usbmmidd_v2.zip'
          curl.exe --fail --location --retry 3 --output $driverArchive $driverUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the signed virtual display driver"
          }
          $actualSha256 = (Get-FileHash -LiteralPath $driverArchive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Virtual display driver checksum mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $driverArchive -DestinationPath $releaseDir -Force
          $requiredDriverFiles = @(
            'usbmmidd_v2\usbmmIdd.inf',
            'usbmmidd_v2\usbmmidd.cat',
            'usbmmidd_v2\x64\usbmmIdd.dll',
            'usbmmidd_v2\deviceinstaller64.exe'
          )
          foreach ($relativePath in $requiredDriverFiles) {
            $driverFile = Join-Path $releaseDir $relativePath
            if (-not (Test-Path -LiteralPath $driverFile -PathType Leaf)) {
              throw "Virtual display driver file is missing: $driverFile"
            }
          }
      - name: Verify Flutter font assets
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $assetRoot = "flutter\build\windows\x64\runner\Release\data\flutter_assets"
          $requiredFonts = @(
            "fonts\MaterialIcons-Regular.otf",
            "assets\gestures.ttf",
            "assets\tabbar.ttf",
            "assets\peer_searchbar.ttf",
            "assets\address_book.ttf",
            "assets\device_group.ttf",
            "assets\more.ttf"
          )
          foreach ($font in $requiredFonts) {
            $fontPath = Join-Path $assetRoot $font
            if (-not (Test-Path -LiteralPath $fontPath -PathType Leaf)) {
              throw "Required Flutter font asset is missing: $fontPath"
            }
          }
      - name: Sign executable with LDesk icon
        shell: bash
        run: |
          choco install rcedit -y
          if [ "${{ matrix.arch }}" = "x86" ]; then
            rcedit "target/i686-pc-windows-msvc/release/luoda.dll" --set-icon "res/icon.ico" || true
            rcedit "target/i686-pc-windows-msvc/release/service.exe" --set-icon "res/icon.ico" || true
            rcedit "target/i686-pc-windows-msvc/release/naming.exe" --set-icon "res/icon.ico" || true
          else
            rcedit "flutter/build/windows/x64/runner/Release/luoda.exe" --set-icon "res/icon.ico"
          fi
      - name: Build portable packer
        timeout-minutes: 15
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            RUST_TARGET="i686-pc-windows-msvc"
            mkdir -p SignOutput
            if [ -f "target/${RUST_TARGET}/release/service.exe" ]; then
              cp "target/${RUST_TARGET}/release/service.exe" SignOutput/LDesk-service-x86.exe
            fi
            if [ -f "target/${RUST_TARGET}/release/naming.exe" ]; then
              cp "target/${RUST_TARGET}/release/naming.exe" SignOutput/LDesk-naming-x86.exe
            fi
            echo "=== x86 CLI executables ==="
            ls -la SignOutput/
          else
            mkdir -p Release
            cp -r flutter/build/windows/x64/runner/Release/* Release/
            if [ ! -f "Release/sciter.dll" ]; then
              echo "=== Downloading sciter.dll ==="
              SCITER_URL="https://github.com/c-smile/sciter-sdk/raw/master/bin/windows/x64/sciter.dll"
              for i in 1 2 3; do
                if curl -sL -o Release/sciter.dll "$SCITER_URL"; then
                  echo "sciter.dll downloaded successfully"
                  break
                fi
                echo "Attempt $i failed, retrying..."
                sleep 3
              done
            fi
            ls -la Release/sciter.dll 2>/dev/null || echo "WARN: sciter.dll not found!"
            echo "=== Release directory ==="
            ls -la Release/
            pip3 install brotli
            cd libs/portable
            python3 generate.py -f ../../Release/ -o . -e ../../Release/luoda.exe
            cd ../..
            cd libs/portable
            cargo build --release
            cd ../..
            mkdir -p SignOutput
            cp target/release/luoda-portable-packer.exe SignOutput/LDesk-portable-x64.exe
            echo "=== Final portable EXE ==="
            ls -la SignOutput/LDesk-portable-x64.exe
          fi
      - name: Verify portable relaunch keeps the running instance intact
        if: matrix.arch == 'x64'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $portable = Resolve-Path 'SignOutput\LDesk-portable-x64.exe'
          $runtimeExe = Join-Path $env:LOCALAPPDATA 'LUODA\luoda.exe'
          $logDir = Join-Path (Resolve-Path '.') '.auto_build_logs'
          [IO.Directory]::CreateDirectory($logDir) | Out-Null
          $runtime = $null
          try {
            $firstLauncher = Start-Process -FilePath $portable -PassThru
            $firstLauncher.WaitForExit(30000) | Out-Null
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $runtime = Get-Process -Name luoda -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $runtimeExe } |
                Select-Object -First 1
              if ($null -ne $runtime) {
                $runtime.Refresh()
              }
            } while (
              ($null -eq $runtime -or $runtime.MainWindowHandle -eq 0) -and
              [DateTime]::UtcNow -lt $deadline
            )
            if ($null -eq $runtime -or $runtime.MainWindowHandle -eq 0) {
              throw 'Portable LDesk did not create a main window'
            }
            if (-not $runtime.Responding) {
              throw 'Portable LDesk stopped responding after first launch'
            }
            $runtimeDll = Join-Path (Split-Path $runtimeExe) 'luoda.dll'
            $beforeHash = (Get-FileHash -LiteralPath $runtimeDll -Algorithm SHA256).Hash
            $beforeWrite = (Get-Item -LiteralPath $runtimeDll).LastWriteTimeUtc
            $firstPid = $runtime.Id

            $secondLauncher = Start-Process -FilePath $portable -PassThru
            $secondLauncher.WaitForExit(30000) | Out-Null
            Start-Sleep -Seconds 2
            $runtime.Refresh()
            if ($runtime.HasExited -or -not $runtime.Responding) {
              throw 'Portable LDesk stopped responding after relaunch'
            }
            $matching = @(
              Get-Process -Name luoda -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $runtimeExe }
            )
            if (@($matching).Count -ne 1 -or $matching[0].Id -ne $firstPid) {
              throw 'Portable relaunch created a duplicate LDesk process'
            }
            $afterHash = (Get-FileHash -LiteralPath $runtimeDll -Algorithm SHA256).Hash
            $afterWrite = (Get-Item -LiteralPath $runtimeDll).LastWriteTimeUtc
            if ($afterHash -ne $beforeHash -or $afterWrite -ne $beforeWrite) {
              throw 'Portable relaunch overwrote files used by the running instance'
            }
          } finally {
            if ($null -ne $runtime -and -not $runtime.HasExited) {
              Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue
            }
            $runtimeLogDirs = @(
              (Join-Path $env:ProgramData 'LUODA\logs'),
              (Join-Path $env:APPDATA 'LDesk\logs'),
              (Join-Path $env:APPDATA 'LUODA\logs')
            )
            foreach ($runtimeLogDir in $runtimeLogDirs) {
              if (Test-Path -LiteralPath $runtimeLogDir) {
                Get-ChildItem -LiteralPath $runtimeLogDir -File | ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName -Destination $logDir -Force
                }
              }
            }
          }
      - name: Smoke test Windows main window responsiveness
        if: matrix.arch == 'x64'
        timeout-minutes: 2
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class LDeskCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT {
              public int Left;
              public int Top;
              public int Right;
              public int Bottom;
            }
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
          }
          '@
          $releaseDir = Resolve-Path 'Release'
          $exe = Join-Path $releaseDir 'luoda.exe'
          $logDir = Join-Path (Resolve-Path '.') '.auto_build_logs'
          [IO.Directory]::CreateDirectory($logDir) | Out-Null
          $process = Start-Process `
            -FilePath $exe `
            -WorkingDirectory $releaseDir `
            -RedirectStandardOutput (Join-Path $logDir 'LDesk-stdout.log') `
            -RedirectStandardError (Join-Path $logDir 'LDesk-stderr.log') `
            -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "LDesk exited during startup with code $($process.ExitCode)"
              }
            } while (
              $process.MainWindowHandle -eq 0 -and
              [DateTime]::UtcNow -lt $deadline
            )
            if ($process.MainWindowHandle -eq 0) {
              throw 'LDesk did not create a main window within 30 seconds'
            }
            for ($attempt = 0; $attempt -lt 5; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited -or -not $process.Responding) {
                throw 'LDesk main window stopped responding during startup'
              }
            }
            $rect = New-Object LDeskCapture+RECT
            if (-not [LDeskCapture]::GetWindowRect(
              $process.MainWindowHandle,
              [ref]$rect
            )) {
              throw 'Failed to inspect the LDesk main window bounds'
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -le 0 -or $height -le 0) {
              throw "Invalid LDesk main window size: ${width}x${height}"
            }
            $bitmap = [System.Drawing.Bitmap]::new($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen(
                $rect.Left,
                $rect.Top,
                0,
                0,
                $bitmap.Size
              )
            } finally {
              $graphics.Dispose()
            }
            $colors = [System.Collections.Generic.HashSet[int]]::new()
            $stepX = [Math]::Max(1, [int]($width / 12))
            $stepY = [Math]::Max(1, [int]($height / 12))
            for ($x = 0; $x -lt $width; $x += $stepX) {
              for ($y = 0; $y -lt $height; $y += $stepY) {
                [void]$colors.Add($bitmap.GetPixel($x, $y).ToArgb())
              }
            }
            if ($colors.Count -lt 4) {
              $bitmap.Dispose()
              throw "Screenshot appears blank: only $($colors.Count) colors"
            }
            $screenshot = Join-Path $logDir 'LDesk-main-window.png'
            $bitmap.Save(
              $screenshot,
              [System.Drawing.Imaging.ImageFormat]::Png
            )
            $bitmap.Dispose()
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $runtimeLogDirs = @(
              (Join-Path $env:ProgramData 'LUODA\logs'),
              (Join-Path $env:APPDATA 'LDesk\logs'),
              (Join-Path $env:APPDATA 'LUODA\logs')
            )
            foreach ($runtimeLogDir in $runtimeLogDirs) {
              if (Test-Path -LiteralPath $runtimeLogDir) {
                Get-ChildItem -LiteralPath $runtimeLogDir -File | ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName -Destination $logDir -Force
                }
              }
            }
          }
      - name: Verify Windows version metadata
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $version = (Get-Item "SignOutput\LDesk-portable-x64.exe").VersionInfo
          if ($version.FileVersion -ne "3.1.1" -or $version.ProductVersion -ne "3.1.1") {
            throw "Unexpected portable EXE version: FileVersion=$($version.FileVersion), ProductVersion=$($version.ProductVersion)"
          }
          if ($version.ProductName -ne "LDesk" -or
              $version.FileDescription -ne "LDesk Direct Chat and Remote Assistance" -or
              $version.OriginalFilename -ne "LDesk-portable-x64.exe") {
            throw "Unexpected portable EXE branding: ProductName=$($version.ProductName), FileDescription=$($version.FileDescription), OriginalFilename=$($version.OriginalFilename)"
          }
      - name: Build x64 installer
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found: $compiler"
          }
          & $compiler 'res\luoda-setup.iss'
          Copy-Item 'res\LDesk-Setup.exe' 'SignOutput\LDesk-3.1.1-Setup-x64.exe'
          if (-not (Test-Path 'SignOutput\LDesk-3.1.1-Setup-x64.exe')) {
            throw 'LDesk installer was not created'
          }
      - name: Rename portable EXE for release
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          Copy-Item 'SignOutput/LDesk-portable-x64.exe' 'SignOutput/LDesk-3.1.1-portable-x64.exe'
      - name: Upload x64 Windows artifacts
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-3.1.1-Windows-x64
          path: |
            SignOutput/LDesk-3.1.1-portable-x64.exe
            SignOutput/LDesk-3.1.1-Setup-x64.exe
          if-no-files-found: error
      - name: Upload x86 service artifacts
        if: matrix.arch == 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-3.1.1-Service-x86
          path: SignOutput/LDesk-*-x86.exe
          if-no-files-found: error
      - name: Upload runtime logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-${{ matrix.arch }}
          path: .auto_build_logs/
          include-hidden-files: true
      - name: Upload to v3.1.1 Release (x64 only)
        if: matrix.arch == 'x64' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/3.1.1'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          draft: true
          tag_name: v3.1.1
          files: |
            SignOutput/LDesk-3.1.1-portable-x64.exe
            SignOutput/LDesk-3.1.1-Setup-x64.exe

[package]
name = "luoda-portable-packer"
version = "3.1.1"
edition = "2021"
description = "LDesk Direct Chat and Remote Assistance"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"

[dependencies]
brotli = "3.4"
dirs = "5.0"
md5 = "0.7"
winapi = { version = "0.3", features = [
    "handleapi",
    "processthreadsapi",
    "winbase",
    "winnt",
    "winuser",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32",
    "Win32_System",
    "Win32_System_SystemInformation",
] }
native-windows-gui = {version = "1.0", default-features = false, features = ["animation-timer", "image-decoder"]}

[package.metadata.winres]
LegalCopyright = "Copyright (c) 2026 LDesk. All rights reserved."
ProductName = "LDesk"
OriginalFilename = "LDesk-portable-x64.exe"
FileDescription = "LDesk Direct Chat and Remote Assistance"
#ProductVersion = ""

[target.'cfg(target_os="windows")'.build-dependencies]
winres = "0.1"
winapi = { version = "0.3", features = [ "winnt", "pdh", "synchapi" ] }

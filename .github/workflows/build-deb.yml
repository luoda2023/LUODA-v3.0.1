permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
  packages: read

name: Build LDesk Linux DEB

on:
  workflow_dispatch:
  push:
    branches: [3.1.1]
    paths:
      - 'build.rs'
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'Images/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vcpkg.json'
      - '.github/workflows/build-deb.yml'

env:
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deb-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-deb-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake curl git nasm yasm ninja-build \
            clang pkg-config unzip wget libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libasound2-dev libpulse-dev libpam0g-dev \
            libx11-dev libglib2.0-dev libblkid-dev liblzma-dev \
            librsvg2-dev dpkg-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev libva-dev libclang-dev \
            libopus-dev libvpx-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev || true

      - name: Setup vcpkg
        shell: bash
        run: |
          # Clone and bootstrap vcpkg natively (pinned commit) instead of
          # run-vcpkg so the downloads dir is under a stable path we can
          # cache across runs.
          if [ ! -d "$HOME/vcpkg/.git" ]; then
            # Cache restore may create $HOME/vcpkg/downloads before this
            # step runs; stash it, wipe the dir, clone fresh, then restore.
            if [ -d "$HOME/vcpkg/downloads" ]; then
              mv "$HOME/vcpkg/downloads" "$HOME/vcpkg-dl-stash"
            fi
            rm -rf "$HOME/vcpkg"
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
            mkdir -p "$HOME/vcpkg/downloads"
            if [ -d "$HOME/vcpkg-dl-stash" ]; then
              mv "$HOME/vcpkg-dl-stash"/* "$HOME/vcpkg/downloads/"
              rmdir "$HOME/vcpkg-dl-stash"
            fi
          fi
          # Full clone so the pinned commit is always reachable.
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT_ID"
          for attempt in 1 2 3; do
            if "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; then
              break
            fi
            echo "vcpkg bootstrap attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          "$HOME/vcpkg/vcpkg" version >/dev/null 2>&1 || { echo "vcpkg bootstrap failed after 3 attempts"; exit 1; }
          echo "vcpkg ready: $("$HOME/vcpkg/vcpkg" version | head -1)"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ~/vcpkg/downloads
          key: vcpkg-dl-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          VCPKG_INSTALL_OK=false
          for i in 1 2 3; do
            echo "vcpkg install attempt $i/3..."
            if $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
              VCPKG_INSTALL_OK=true
              break
            fi
            echo "Attempt $i failed."
            if [ "$i" -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$VCPKG_INSTALL_OK" != true ]; then
            echo "ERROR: vcpkg install failed after 3 attempts"
            exit 1
          fi
        shell: bash

      - name: Setup Flutter
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Ensure correct cargo version
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
          rustup default 1.88

      - name: Configure Git for private forks
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Generate FFI bridge
        timeout-minutes: 20
        run: |
          echo "=== Installing cargo-expand ==="
          cargo install cargo-expand --version 1.0.95 --locked 2>&1 | tail -5
          echo "=== Installing flutter_rust_bridge_codegen ==="
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked 2>&1 | tail -5
          echo "=== Running flutter pub get ==="
          cd flutter && flutter pub get && cd ..
          GENERATED="flutter/lib/generated_bridge.dart"
          if [ -f "$GENERATED" ] && [ "$(git log -1 --format="%an" -- "$GENERATED" 2>/dev/null)" != "" ]; then
            echo "=== Bridge file already exists, skipping codegen ==="
            ls -la "$GENERATED"
            head -5 "$GENERATED"
          else
          echo "=== Running flutter_rust_bridge_codegen ==="
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart 2>&1 || echo "WARNING: codegen failed, using existing file"
          fi
          echo "=== Verifying generated file ==="
          ls -la flutter/lib/generated_bridge.dart || echo "ERROR: generated_bridge.dart not created!"
          head -5 flutter/lib/generated_bridge.dart || echo "ERROR: Cannot read file!"

      - name: Build Rust binary
        timeout-minutes: 40
        run: |
          cargo build --release --features flutter
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          CXXFLAGS: "-include cstdint"

      - name: Validate shared chat and UI contracts
        timeout-minutes: 10
        run: |
          cd flutter
          flutter test test/direct_chat_protocol_test.dart test/viewer_invite_link_test.dart test/ui_regression_contract_test.dart

      - name: Build Flutter Linux
        timeout-minutes: 30
        run: |
          cd flutter
          flutter build linux --release

      - name: Package DEB
        run: |
          mkdir -p tmpdeb/usr/bin tmpdeb/usr/share/luoda tmpdeb/DEBIAN
          mkdir -p tmpdeb/usr/share/luoda/files/systemd
          mkdir -p tmpdeb/usr/share/applications
          mkdir -p tmpdeb/usr/share/icons/hicolor/256x256/apps
          cp target/release/luoda tmpdeb/usr/bin/
          cp -r flutter/build/linux/x64/release/bundle/* tmpdeb/usr/share/luoda/
          cp res/luoda.service tmpdeb/usr/share/luoda/files/systemd/
          cp res/luoda.desktop tmpdeb/usr/share/luoda/files/
          cp res/luoda.desktop tmpdeb/usr/share/applications/
          cp res/luoda-link.desktop tmpdeb/usr/share/applications/
          cp Images/icon-256.png tmpdeb/usr/share/icons/hicolor/256x256/apps/luoda.png
          cat > tmpdeb/DEBIAN/control << EOF
          Package: luoda
          Version: 3.1.1
          Architecture: amd64
          Maintainer: LDesk
          Description: LDesk Direct Chat and Remote Assistance
          EOF
          # Include postinst/prerm scripts to auto-start service
          cp res/DEBIAN/postinst tmpdeb/DEBIAN/
          cp res/DEBIAN/prerm tmpdeb/DEBIAN/
          chmod 755 tmpdeb/DEBIAN/postinst tmpdeb/DEBIAN/prerm
          dpkg-deb --build tmpdeb LDesk-3.1.1.deb

      - name: Package RPM
        run: |
          sudo apt-get install -y alien rpm
          sudo alien --to-rpm LDesk-3.1.1.deb --scripts
          ls -la *.rpm
          mv *.rpm LDesk-3.1.1.rpm

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-3.1.1-DEB
          path: LDesk-3.1.1.deb
          if-no-files-found: error

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-3.1.1-RPM
          path: LDesk-3.1.1.rpm
          if-no-files-found: error
      - name: Upload to Release
        if: github.ref == 'refs/heads/3.1.1'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          prerelease: false
          draft: true
          tag_name: v3.1.1
          token: ${{ secrets.RELEASE_PAT }}
          files: |
            LDesk-3.1.1.deb
            LDesk-3.1.1.rpm
      - name: Upload runtime logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-deb
          path: .auto_build_logs/
